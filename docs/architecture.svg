<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Agentic QA Pipeline pipeline architecture</title>
<desc>Jira ticket flows through a Planning Agent orchestrator that dispatches five agents (Jira, Excel, TMS, Generator, Healer) through three human-decision gates - a pre-generation requirement gap check plus two human-approval gates - producing traceability, healing/flaky, and cost telemetry, plus two CI guardrails at PR time.</desc>

<style>
  .box { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.5; rx: 8; }
  .orchestrator { fill: #111827; stroke: #111827; rx: 8; }
  .gate { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 6; }
  .telemetry { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 8; }
  .guardrail { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; rx: 8; }
  .label { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 13px; fill: #111827; }
  .sublabel { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #6b7280; }
  .orchlabel { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 13px; fill: #ffffff; font-weight: 600; }
  .section { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 11px; fill: #9ca3af; letter-spacing: 0.05em; }
  .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  .gatearrow { stroke: #d97706; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-amber); }
</style>

<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
  </marker>
  <marker id="arrowhead-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
  </marker>
</defs>

<!-- Jira ticket input -->
<rect x="20" y="60" width="140" height="50" class="box"/>
<text x="90" y="82" text-anchor="middle" class="label">Jira ticket</text>
<text x="90" y="98" text-anchor="middle" class="sublabel">requirement in</text>

<!-- Planning Agent orchestrator -->
<rect x="220" y="45" width="220" height="80" class="orchestrator"/>
<text x="330" y="78" text-anchor="middle" class="orchlabel">Planning Agent</text>
<text x="330" y="96" text-anchor="middle" class="sublabel" fill="#d1d5db">orchestrator - dispatches all 5 agents,</text>
<text x="330" y="110" text-anchor="middle" class="sublabel" fill="#d1d5db">wraps each with a cost marker</text>

<path d="M160,85 L220,85" class="arrow"/>
<text x="190" y="76" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="8" fill="#d97706">Gate 0</text>

<!-- Scenario generation output -->
<rect x="500" y="45" width="150" height="50" class="box"/>
<text x="575" y="67" text-anchor="middle" class="label">Scenarios</text>
<text x="575" y="83" text-anchor="middle" class="sublabel">specs/&lt;key&gt;.plan.md</text>
<path d="M440,80 L500,70" class="arrow"/>

<!-- Gate 1 -->
<rect x="500" y="130" width="150" height="55" class="gate"/>
<text x="575" y="153" text-anchor="middle" class="label">Gate 1</text>
<text x="575" y="170" text-anchor="middle" class="sublabel">human approves scenarios</text>
<path d="M575,95 L575,130" class="gatearrow"/>

<!-- Excel Agent -->
<rect x="500" y="215" width="150" height="55" class="box"/>
<text x="575" y="238" text-anchor="middle" class="label">Excel Agent</text>
<text x="575" y="255" text-anchor="middle" class="sublabel">sign-off sheet</text>
<path d="M575,185 L575,215" class="gatearrow"/>

<!-- Gate 2 -->
<rect x="500" y="300" width="150" height="55" class="gate"/>
<text x="575" y="323" text-anchor="middle" class="label">Gate 2</text>
<text x="575" y="340" text-anchor="middle" class="sublabel">human approves test cases</text>
<path d="M575,270 L575,300" class="gatearrow"/>

<!-- TMS Agent -->
<rect x="500" y="385" width="150" height="55" class="box"/>
<text x="575" y="408" text-anchor="middle" class="label">TMS Agent</text>
<text x="575" y="425" text-anchor="middle" class="sublabel">Qase (provider-agnostic)</text>
<path d="M575,355 L575,385" class="arrow"/>

<!-- Generator Agent -->
<rect x="720" y="385" width="150" height="55" class="box"/>
<text x="795" y="408" text-anchor="middle" class="label">Generator Agent</text>
<text x="795" y="425" text-anchor="middle" class="sublabel">real Playwright spec</text>
<path d="M650,412 L720,412" class="arrow"/>

<!-- Healer Agent -->
<rect x="720" y="470" width="150" height="55" class="box"/>
<text x="795" y="493" text-anchor="middle" class="label">Healer Agent</text>
<text x="795" y="510" text-anchor="middle" class="sublabel">run, heal, or quarantine</text>
<path d="M795,440 L795,470" class="arrow"/>

<!-- Telemetry outputs -->
<text x="30" y="490" class="section">TELEMETRY &amp; GOVERNANCE</text>

<rect x="20" y="505" width="180" height="65" class="telemetry"/>
<text x="110" y="530" text-anchor="middle" class="label">Traceability</text>
<text x="110" y="546" text-anchor="middle" class="sublabel">6-state drift detection,</text>
<text x="110" y="560" text-anchor="middle" class="sublabel">baseline never auto-synced</text>

<rect x="220" y="505" width="180" height="65" class="telemetry"/>
<text x="310" y="530" text-anchor="middle" class="label">Healing / Flaky</text>
<text x="310" y="546" text-anchor="middle" class="sublabel">deliberately separate</text>
<text x="310" y="560" text-anchor="middle" class="sublabel">telemetry streams</text>

<rect x="420" y="505" width="180" height="65" class="telemetry"/>
<text x="510" y="530" text-anchor="middle" class="label">Cost / Latency</text>
<text x="510" y="546" text-anchor="middle" class="sublabel">real per-agent attribution,</text>
<text x="510" y="560" text-anchor="middle" class="sublabel">not one undifferentiated total</text>

<path d="M330,125 C330,300 110,300 110,505" class="arrow" stroke-dasharray="3,3"/>
<path d="M575,440 C575,470 310,470 310,505" class="arrow" stroke-dasharray="3,3"/>
<path d="M795,525 C795,545 600,545 600,538" class="arrow" stroke-dasharray="3,3"/>

<!-- CI Guardrails -->
<text x="750" y="600" class="section">PR-TIME, NON-AGENT CI GATES</text>

<rect x="720" y="615" width="200" height="60" class="guardrail"/>
<text x="820" y="640" text-anchor="middle" class="label">Assertion Integrity</text>
<text x="820" y="656" text-anchor="middle" class="sublabel">blocks weakened/deleted asserts</text>

<rect x="720" y="685" width="200" height="60" class="guardrail"/>
<text x="820" y="710" text-anchor="middle" class="label">Locator Priority</text>
<text x="820" y="726" text-anchor="middle" class="sublabel">blocks CSS/XPath locators</text>

<path d="M870,525 C950,560 950,590 870,615" class="arrow" stroke-dasharray="3,3"/>

</svg>
