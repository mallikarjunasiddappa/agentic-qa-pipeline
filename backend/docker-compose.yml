services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa_pipeline
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: qa_pipeline_backend
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
